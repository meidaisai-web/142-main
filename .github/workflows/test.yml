name: Test

on:
  push:

# 同じブランチに続けて push したときは、古い実行を止めて最新のコミットだけテストする
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # キャッシュ済みの古い 24.x ではなく、常に 24 系の最新版を使う
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
